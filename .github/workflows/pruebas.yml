name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest
      - name: Pruebas
        run: python -m pytest
      - name: La app arranca con los artefactos publicados
        run: python -c "from app.app import app; print('Layout OK')"
