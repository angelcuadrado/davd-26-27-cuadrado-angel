name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest ruff==0.17.6
      - name: Estilo (ruff)
        run: ruff check src app tests notebooks
      - name: Pruebas
        run: python -m pytest
      - name: La app arranca con los artefactos publicados
        run: python -c "from app.app import app; print('Layout OK')"
